name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow Dependabot lockfile-sync step to push back
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Dependabot's grouped updates lockfile sync
      - name: Sync lockfile (Dependabot)
        if: github.actor == 'dependabot[bot]'
        run: |
          npm install --package-lock-only --no-audit --no-fund
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): sync package-lock.json" package-lock.json
            git push
          fi

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Test Frontend (Vitest)
        run: npm test

      - name: Build Frontend
        run: npm run build

      - name: Install & Build Server
        run: |
          cd server
          npm ci
          npm run build
