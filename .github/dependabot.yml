version: 2
updates:
  # Root frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # HeroUI + its React Aria peers must move in ONE PR. Keep this group FIRST (first match wins).
      # No update-types on purpose: a HeroUI major arrives together with its peers (and is never auto-merged).
      heroui:
        patterns:
          - "@heroui/*"
          - "react-aria"
          - "react-aria-components"
          - "react-stately"
          - "@react-aria/*"
          - "@react-stately/*"
          - "@react-types/*"
          - "@internationalized/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
