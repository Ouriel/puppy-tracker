version: 2
updates:
  # Root frontend dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # HeroUI + its React Aria peers must move in ONE PR. Keep this group FIRST (first match wins).
      # No update-types on purpose: a HeroUI major arrives together with its peers (and is never auto-merged).
      heroui:
        patterns:
          - "@heroui/*"
          - "react-aria"
          - "react-aria-components"
          - "react-stately"
          - "@react-aria/*"
          - "@react-stately/*"
          - "@react-types/*"
          - "@internationalized/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types must match the runtime: Node 24 on Vercel and in CI. Bump the major together with both.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
